<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouchOSC Combi Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; }
    .navbar { background-color: #1e1e1e; border-bottom: 1px solid #333; }
    .navbar-brand { font-weight: 600; letter-spacing: 0.05em; }
    .card { background-color: #1e1e1e; border: 1px solid #333; }
    .table { color: #e0e0e0; }
    .table thead th { border-bottom-color: #444; color: #aaa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .table td { border-bottom-color: #2a2a2a; vertical-align: middle; }
    .table-hover tbody tr:hover td { background-color: #686868; }
    .form-control, .form-select {
      background-color: #2a2a2a;
      border-color: #444;
      color: #e0e0e0;
    }
    .form-control:focus, .form-select:focus {
      background-color: #2a2a2a;
      border-color: #6d6af0;
      color: #e0e0e0;
      box-shadow: 0 0 0 0.2rem rgba(109,106,240,0.25);
    }
    .form-control::placeholder { color: #555; }
    .btn-accent { background-color: #6d6af0; border-color: #6d6af0; color: #fff; }
    .btn-accent:hover { background-color: #5a57d6; border-color: #5a57d6; color: #fff; }
    .slot-label { font-size: 0.7rem; color: #666; font-family: monospace; }
    .row-cols-md-8 > * { flex: 0 0 auto; width: 12.5%; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container-lg">
      <a class="navbar-brand" href="/">TouchOSC Combi Manager</a>
      <a href="/export" class="btn btn-sm btn-outline-light">Export Lua</a>
    </div>
  </nav>
  <div class="container-lg">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
